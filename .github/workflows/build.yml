name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: |
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle.kts
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle.kts
        echo "rootProject.name = \"EsquiveApp\"" >> settings.gradle.kts
        echo "include(\":app\")" >> settings.gradle.kts
        
        mkdir -p app/src/main
        mv -f AndroidManifest.xml app/src/main/ || true
        mv -f index.html app/src/main/assets/ || true
        mkdir -p app/src/main/java/com/nico/esquive/
        mv -f MainActivity.kt app/src/main/java/com/nico/esquive/ || true
        
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
